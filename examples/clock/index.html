<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      height: 100vh;
      padding: 0;
      margin: 0;
      align-items: center;
      font-family: Arial;
    }
      
    #clock {
      position: relative;
      width: 300px;
      aspect-ratio: 1;
      background-color: whitesmoke;
      border: 1px dashed black;
      border-radius: 50%;
      outline: 1px solid black;
      outline-offset: 2px;
      box-shadow: 0 0 10px black;
      background-image: radial-gradient(#fff 66%, #000 95%);
    }

    #hour, #minute, #second {
      position: absolute;
      left: 50%;
      rotate: 0deg;
      transform-origin: left;
      opacity: 0.6;
    }

    #hour {
      top: calc(50% - 6px);
      height: 12px;
      width: 40%;
      background-color: black;
      border-top-right-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    #minute {
      top: calc(50% - 3px);
      height: 6px;
      width: 45%;
      background-color: red;      
      border-top-right-radius: 3px;
      border-bottom-right-radius: 3px;
    }
    
    #second {
      top: calc(50% - 1px);
      height: 2px;
      width: 48%;
      background-color: blue;
    }

    #dig {
      position: absolute;
      left: 50%;
      top: 70%;
      transform: translatex(-50%);
      background-color: black;
      color: white;
      padding: 3px;      
      }

      #center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 25px;
        aspect-ratio: 1;
        background-color: black;
        border-radius: 50%;
      }

      .mark {
          position: absolute;
          top: 50%;
          left: 50%;
          translate: -50% -50%;
      }
      
  </style>    
</head>

<body>

  <script src="../../dproxy.js"></script>
  <script src="../../kss.js"></script>
  <script src="index.js"></script>
</body>
