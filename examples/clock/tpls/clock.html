<template kss-tpl-id="clock">
  <div id="clock">
    
    <div :foreach="$$arr" :as="h" class="mark"
         style="top: calc(50% + {135 * Math.sin($$h * Math.PI/6 - Math.PI/2)}px);
                left: calc(50% + {135 * Math.cos($$h * Math.PI/6 - Math.PI/2)}px);
                "><text :content="$$h"></text>
    </div>
    
    <div id="dig">
      <text :content="{$$hour}:{$$minute}:{$$second}"></text>
    </div>
    <div id="hour" style="rotate: {$$hdeg}deg;"></div>
    <div id="minute" style="rotate: {$$mdeg}deg;"></div>
    <div id="second" style="rotate: {$$sdeg}deg;"></div>
    <div id="center"></div>
  </div>
</template>
